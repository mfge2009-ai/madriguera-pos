<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5c4a2a">
<title>La Madriguera | Mis obras en consignación</title>
<link rel="icon" href="../asistencia/icono-192.png">
<style>
:root{
  --bg:#f8f6f1;--bg2:#fff;--bg3:#f0ede6;
  --text:#1a1a1a;--text2:#555;--text3:#8a857b;
  --border:#ddd8ce;--acc:#5c4a2a;--acc2:#7a6240;--acl:#ede5d0;
  --grn:#1f6b45;--gbg:#d4edda;--amb:#8a4f00;--abg:#fff3cd;
  --red:#8b1a1a;--rbg:#fde8e8;--blu:#1a3f8b;--bbg:#ddeeff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
  min-height:100dvh;font-size:16px;-webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}
header{background:var(--acc);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header .marca{font-weight:800;letter-spacing:.04em;flex:1}
header .marca small{display:block;font-weight:400;opacity:.85;font-size:12px;letter-spacing:0}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
h1{font-size:19px;margin-bottom:4px}
h2{font-size:15px;margin-bottom:10px}
.sub{color:var(--text2);font-size:13.5px;line-height:1.5}
.mini{color:var(--text3);font-size:12px;line-height:1.5}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.cif{background:var(--bg3);border-radius:10px;padding:10px 12px}
.cif b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.cif span{font-size:11.5px;color:var(--text2)}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pv{background:var(--gbg);color:var(--grn)}
.pa{background:var(--abg);color:var(--amb)}
.pr{background:var(--rbg);color:var(--red)}
.pg{background:var(--bg3);color:var(--text2)}
table.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text3)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
.fila{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.fila:last-child{border-bottom:0}
.fila .d{flex:1;min-width:0}
.fila .m{font-weight:700;color:var(--grn);font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--acc);color:#fff;border:0;border-radius:11px;padding:13px 16px;font-weight:700;width:100%;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.g{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:4px}
label.f input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg2)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;margin:12px 0}
.chk input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.aviso{border-radius:11px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:12px}
.aviso.ok{background:var(--gbg);color:var(--grn)}
.aviso.err{background:var(--rbg);color:var(--red)}
.aviso.inf{background:var(--bbg);color:var(--blu)}
details.doc{border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-top:10px;background:var(--bg3)}
details.doc summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--acc)}
.contrato-caja{max-height:46vh;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:12px;margin-top:10px}
.au-contrato{font-family:Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.55;text-align:justify}
.au-contrato h2{font-size:14px;font-family:system-ui,sans-serif}
.au-contrato h3{font-size:12.5px;font-family:system-ui,sans-serif}
.au-contrato p{margin:0 0 9px}
.au-tabla{width:100%;border-collapse:collapse;font-family:system-ui,sans-serif;font-size:10.5px}
.au-tabla th,.au-tabla td{border:1px solid #bbb;padding:3px 5px}
.au-tabla thead th{background:#eee}
.au-firmas{width:100%;margin-top:26px;font-family:system-ui,sans-serif;font-size:10.5px}
.au-firmas td{width:50%;vertical-align:top;padding-top:10px;text-align:center}
footer{text-align:center;padding:18px 16px 28px;color:var(--text3);font-size:11.5px;line-height:1.6}
@media print{header,footer,.noprint{display:none}.contrato-caja{max-height:none;overflow:visible;border:0}}
</style>
</head>
<body>
<header><div class="marca">LA MADRIGUERA<small>Autores ecuatorianos · consignación</small></div></header>
<main id="main"><div class="card"><div class="sub">Cargando tu información…</div></div></main>
<footer id="pie"></footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Mismo proyecto que el POS (la-madriguera-cb489)
const firebaseConfig = {
  apiKey: "AIzaSyBzAwD0HBDhWe7u_1o1toLPJLhiduHVJyo",
  authDomain: "la-madriguera-cb489.firebaseapp.com",
  projectId: "la-madriguera-cb489",
  storageBucket: "la-madriguera-cb489.firebasestorage.app",
  messagingSenderId: "648077569073",
  appId: "1:648077569073:web:7b438dfdac9d5fef063910"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COL = 'lm_autor_reportes';

const esc = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmt = n => '$'+(Number(n)||0).toFixed(2);
const pct = p => Math.round((Number(p)||0)*1000)/10+'%';
const fecha = iso => { if(!iso) return '—'; const [a,m,d]=String(iso).slice(0,10).split('-'); return d&&m&&a?`${d}/${m}/${a}`:String(iso); };
const fechaHora = v => { if(!v) return '—'; const d=new Date(v); return isNaN(d)?String(v):d.toLocaleString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
const $ = id => document.getElementById(id);
const main = $('main');

const token = new URLSearchParams(location.search).get('t') || location.hash.replace(/^#\/?/,'') || '';
let D = null, FIRMA = null;

function pantallaError(titulo, detalle){
  main.innerHTML = `<div class="card"><h1>${esc(titulo)}</h1><div class="sub">${esc(detalle)}</div>
    <div class="mini" style="margin-top:12px">Si crees que es un error, escríbenos y te reenviamos el enlace.</div></div>`;
  $('pie').textContent='';
}

async function arrancar(){
  if(!token){ return pantallaError('Falta el enlace completo','Abre el enlace tal como te lo enviamos, sin recortarlo. Debe terminar en ?t= seguido de un código largo.'); }
  let snap;
  try{ snap = await getDoc(doc(db,COL,token)); }
  catch(e){ return pantallaError('No pudimos conectarnos','Revisa tu conexión a internet y vuelve a abrir el enlace. ('+(e&&e.code||'error')+')'); }
  if(!snap.exists()){ return pantallaError('Este enlace ya no está disponible','Puede haber sido reemplazado por uno nuevo. Ref. '+token.slice(0,8)); }
  const raw = snap.data() || {};
  D = raw.v || {};
  // La firma que el autor dejó en este enlace y que el POS todavía no ha absorbido.
  FIRMA = raw.firma || null;
  pintar();
}

function pintar(){
  const a=D.autor||{}, c=D.condiciones||{}, t=D.totales||{}, ct=D.contrato||{};
  const nombre=String(a.nombre||'').trim();
  const pila=nombre.split(' ')[0]||'';
  const obras=D.obras||[], ventas=D.ventas||[], liqs=D.liquidaciones||[];

  const hoy=new Date();
  const estadoObra=o=>{
    if(o.estado==='retirada') return '<span class="pill pg">Retirada</span>';
    if(!(+o.stock||0)) return '<span class="pill pv">Agotada</span>';
    if(o.fechaVence&&new Date(o.fechaVence)<hoy) return '<span class="pill pr">Plazo vencido</span>';
    return '<span class="pill pv">En exhibición</span>';
  };

  main.innerHTML = `
  <div class="card">
    <h1>Hola${pila?', '+esc(pila):''}</h1>
    <div class="sub">Esta es tu página privada en La Madriguera. Aquí ves tus obras en exhibición, tus ventas al día y lo que te corresponde. Se actualiza sola cada vez que se vende un ejemplar.</div>
    <div class="cifras">
      <div class="cif"><b>${+t.titulos||0}</b><span>título(s) entregado(s)</span></div>
      <div class="cif"><b>${+t.stock||0}</b><span>ejemplares en percha</span></div>
      <div class="cif"><b>${+t.vendidos||0}</b><span>ejemplares vendidos</span></div>
      <div class="cif"><b style="color:var(--grn)">${fmt(t.porPagar)}</b><span>por pagarte</span></div>
    </div>
    <div class="mini" style="margin-top:12px">Condiciones pactadas: te corresponde el <b>${pct(c.pct)}</b> del precio de venta al público · plazo de exhibición de <b>${+c.plazoDias||0} días</b>${c.formaPago?' · pago por '+esc(c.formaPago):''}.</div>
  </div>

  <div class="card" id="cCon"></div>

  <div class="card">
    <h2>Tus obras</h2>
    ${obras.length?`<table class="t">
      <thead><tr><th>Obra</th><th class="n">PVP</th><th class="c">Entregados</th><th class="c">En percha</th><th class="c">Vendidos</th></tr></thead>
      <tbody>${obras.map(o=>`<tr>
        <td><b>${esc(o.titulo)}</b><div class="mini">${estadoObra(o)}${o.pct!=null?' · '+pct(o.pct)+' para ti':''}${o.fechaVence?' · vence '+fecha(o.fechaVence):''}</div></td>
        <td class="n">${fmt(o.pvp)}</td><td class="c">${+o.entregados||0}</td>
        <td class="c">${+o.stock||0}</td><td class="c">${+o.vendidos||0}</td></tr>`).join('')}</tbody>
    </table>`:'<div class="sub">Todavía no hay obras registradas a tu nombre.</div>'}
    ${(+t.devueltos||0)?`<div class="mini" style="margin-top:8px">Ejemplares devueltos a la fecha: ${+t.devueltos}.</div>`:''}
  </div>

  <div class="card">
    <h2>Tus ventas</h2>
    ${ventas.length?ventas.map(v=>`<div class="fila">
        <div class="d"><b style="font-size:13.5px">${esc(v.titulo)}</b>
          <div class="mini">${fecha(v.fecha)} · ${+v.cantidad||0} ejemplar(es) a ${fmt(v.pvp)} · ${pct(v.pct)} para ti${v.liquidada?' · ya liquidada':''}</div></div>
        <div class="m">${fmt(v.pagoAutor)}</div>
      </div>`).join(''):'<div class="sub">Aún no se ha vendido ningún ejemplar. En cuanto se venda el primero, aparecerá aquí el mismo día.</div>'}
    ${ventas.length?`<div class="aviso inf" style="margin:12px 0 0">Pendiente de pago: <b>${fmt(t.porPagar)}</b> sobre una venta bruta de ${fmt(t.brutoPendiente)}. Lo marcado como «ya liquidada» corresponde a pagos que constan abajo.</div>`:''}
  </div>

  ${liqs.length?`<div class="card">
    <h2>Pagos recibidos</h2>
    <table class="t"><thead><tr><th>Acta</th><th>Fecha</th><th class="c">Ej.</th><th class="n">Pagado</th></tr></thead>
      <tbody>${liqs.map(l=>`<tr><td>${esc(l.numero)}<div class="mini">${esc(l.metodo||'')}</div></td>
        <td>${fecha(l.fecha)}</td><td class="c">${+l.unidades||0}</td><td class="n"><b>${fmt(l.pagoAutor)}</b></td></tr>`).join('')}</tbody></table>
  </div>`:''}

  <div class="card">
    <h2>¿Algo no cuadra?</h2>
    <div class="sub">Si ves una venta que no reconoces, un ejemplar que ya retiraste o un precio distinto al que acordamos, escríbenos y lo revisamos contigo antes de la próxima liquidación.</div>
  </div>`;

  $('pie').innerHTML = `Datos actualizados al ${esc(fechaHora(D.actualizado))}.<br>${esc((D.casa&&D.casa.nombre)||'')} · ${esc((D.casa&&D.casa.direccion)||'')}<br>Enlace privado: no lo compartas.`;
  pintarContrato();
}

function pintarContrato(){
  // El contrato está firmado si el POS ya lo registró, o si la firma sigue
  // esperando en este enlace a que el POS la lea.
  const ct=(D.contrato&&D.contrato.aceptado)?D.contrato:(FIRMA&&FIRMA.aceptado?FIRMA:(D.contrato||{}));
  const c=D.condiciones||{};
  const caja=$('cCon');
  const texto=`<div class="contrato-caja">${D.contratoTexto||'<div class="sub">El texto del contrato no está disponible en este momento.</div>'}</div>`;

  if(ct.aceptado){
    caja.innerHTML = `<h2>Contrato de consignación</h2>
      <div class="aviso ok"><b>Aceptado el ${esc(fechaHora(ct.fecha))}</b>${ct.nombre?'<br>'+esc(ct.nombre):''}</div>
      <div class="sub">Quedó registrado tu consentimiento con el reparto del ${pct(c.pct)} a tu favor y el plazo de exhibición de ${+c.plazoDias||0} días. Puedes volver a leerlo cuando quieras o imprimirlo.</div>
      <details class="doc"><summary>Leer el contrato</summary>${texto}</details>
      <button class="btn g noprint" style="margin-top:10px" id="bImp">Imprimir o guardar en PDF</button>`;
    $('bImp').onclick=()=>window.print();
    return;
  }

  caja.innerHTML = `<h2>Contrato de consignación</h2>
    <div class="aviso inf">Antes de que tus obras salgan a la percha necesitamos tu aceptación. Léelo con calma: puedes desplazarte dentro del recuadro.</div>
    ${texto}
    <div style="margin-top:14px">
      <label class="f"><span>Tu nombre completo, como consta en tu cédula</span><input id="fNom" autocomplete="name" value="${esc((D.autor&&D.autor.nombre)||'')}"></label>
      <label class="f"><span>Tu número de cédula</span><input id="fCed" inputmode="numeric" autocomplete="off"></label>
      <label class="chk"><input type="checkbox" id="fOk">
        <span>He leído y acepto el contrato de comisión mercantil para la venta de mis obras en consignación, con el reparto del ${pct(c.pct)} a mi favor y el plazo de exhibición de ${+c.plazoDias||0} días.</span></label>
      <div id="fErr"></div>
      <button class="btn" id="bAcc">Aceptar el contrato</button>
      <div class="mini" style="margin-top:10px">Al aceptar se guardan tu nombre, tu cédula y la fecha y hora de aceptación, como respaldo del contrato. Nada más.</div>
    </div>`;

  $('bAcc').onclick=async()=>{
    const nom=$('fNom').value.trim(), ced=$('fCed').value.trim(), ok=$('fOk').checked;
    const err=$('fErr');
    const falla=m=>{ err.innerHTML='<div class="aviso err">'+esc(m)+'</div>'; };
    if(nom.length<5) return falla('Escribe tu nombre completo.');
    if(!/^[0-9]{10,13}$/.test(ced.replace(/\D/g,''))) return falla('Escribe tu número de cédula, solo los dígitos.');
    if(!ok) return falla('Marca la casilla para aceptar el contrato.');
    err.innerHTML='';
    const b=$('bAcc'); b.disabled=true; b.textContent='Registrando…';
    try{
      const ahora=new Date().toISOString();
      // Solo el campo 'firma' es escribible por el autor: las reglas no le
      // dejan tocar la foto de sus cifras, que la escribe el POS.
      await updateDoc(doc(db,COL,token),{
        firma:{aceptado:true,fecha:ahora,nombre:nom,cedula:ced.replace(/\D/g,''),canal:'enlace'}
      });
      FIRMA={aceptado:true,fecha:ahora,nombre:nom};
      pintarContrato();
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){
      b.disabled=false; b.textContent='Aceptar el contrato';
      falla('No se pudo registrar la aceptación ('+(e&&e.code||'error')+'). Revisa tu conexión e inténtalo de nuevo.');
    }
  };
}

arrancar();
</script>
</body>
</html>
